# Lease Desk, local stack.
#
#   make up        db, minio, api, worker
#   make up-all    plus web (A8) and fava (A7)
#
# The host talks to Postgres on ${LEASEDESK_DB_PORT:-5433}, not 5432, so a
# Postgres already installed on the laptop does not collide with this one.
# Containers always reach it as db:5432.

name: leasedesk

x-backend: &backend
  build:
    context: .
    dockerfile: backend/Dockerfile
  env_file:
    - path: .env
      required: false
  environment:
    LEASEDESK_DB_HOST: db
    LEASEDESK_DB_PORT: "5432"
  depends_on:
    db:
      condition: service_healthy
  restart: unless-stopped

services:
  db:
    image: postgres:16.4-alpine
    environment:
      # The owner runs migrations and creates the four application roles.
      POSTGRES_USER: ${LEASEDESK_DB_OWNER:-leasedesk}
      POSTGRES_PASSWORD: ${LEASEDESK_DB_OWNER_PASSWORD:-leasedesk}
      POSTGRES_DB: ${LEASEDESK_DB_NAME:-leasedesk}
    ports:
      - "${LEASEDESK_DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${LEASEDESK_MINIO_USER:-leasedesk}
      MINIO_ROOT_PASSWORD: ${LEASEDESK_MINIO_PASSWORD:-leasedesk-dev}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  api:
    <<: *backend
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 20

  worker:
    <<: *backend
    command: ["python", "-m", "app.jobs.worker"]

  # The Next.js app lands in frontend/ with the thin slice (A8).
  web:
    profiles: ["web"]
    image: node:20.18-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
    command: ["sh", "-c", "npm install && npm run dev -- --hostname 0.0.0.0"]
    ports:
      - "3000:3000"
    depends_on:
      - api

  # Fava reads the Beancount export written by `make export-ledger` (A7).
  fava:
    profiles: ["ledger"]
    image: python:3.13-slim
    command: ["sh", "-c", "pip install --quiet fava && fava --host 0.0.0.0 /ledger/leasedesk.beancount"]
    volumes:
      - ./data/ledger:/ledger:ro
    ports:
      - "5000:5000"

volumes:
  pgdata:
  miniodata:
