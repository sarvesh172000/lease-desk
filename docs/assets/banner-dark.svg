<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-label="Lease Desk: reads every lease, checks every landlord bill, holds only what is wrong, and waits for a person.">
  <rect width="1200" height="260" rx="18" fill="#0A0B0D"/>
  <rect x="0" y="0" width="1200" height="260" rx="18" fill="none" stroke="#262A31"/>
  <g transform="translate(60 60)">
    <rect width="40" height="40" rx="10" fill="#5EEAD4"/>
    <text x="20" y="28" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#08100E">L</text>
    <text x="56" y="20" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#EDEFF3">Lease Desk</text>
    <text x="56" y="40" font-family="JetBrains Mono, SFMono-Regular, Menlo, monospace" font-size="11" letter-spacing="2" fill="#848B96">CAL HACKS 13.0 · AUTONOMOUS LEASE ACCOUNTING</text>
  </g>
  <text x="60" y="162" font-family="Inter, Helvetica, Arial, sans-serif" font-size="46" font-weight="700" letter-spacing="-1.5" fill="#5EEAD4">$443,255.70 was missing</text>
  <text x="60" y="198" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" fill="#AEB4BE">The amendment was in the mailbox. The books ran the old schedule.</text>
  <text x="60" y="226" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-style="italic" fill="#AEB4BE">Lease Desk read both.</text>
