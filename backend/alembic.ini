# Migrations run as the database owner. The URL comes from app.settings, not
# from this file, so there is one place to configure the database.
[alembic]
script_location = %(here)s/app/db/migrations
prepend_sys_path = %(here)s:%(here)s/..

[loggers]
keys = root,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
