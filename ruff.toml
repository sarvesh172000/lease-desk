# Ruff, scoped to the platform code (Phase 1 groups 1 to 5 and 11).
#
#   make lint                 ruff check on this scope
#   pre-commit run --all-files
#
# The engine (leasedesk/), the generator (datagen/), the eval (eval/) and the
# agent/engine/llm packages under backend/app are deliberately outside the
# scope, so nothing here rewrites a teammate's files. Widen `include` when a
# package's owner opts in.

line-length = 120
target-version = "py311"

include = [
    "backend/app/db/**/*.py",
    "backend/app/work/**/*.py",
    "backend/app/auth/**/*.py",
    "backend/app/ledger/**/*.py",
    "backend/app/jobs/**/*.py",
    "backend/app/records/**/*.py",
    "backend/app/api/**/*.py",
    "backend/app/main.py",
    "backend/app/settings.py",
    "backend/tests/platform/**/*.py",
]
# `include` only steers discovery. Explicit paths (pre-commit, editors) are
# kept in scope by this exclude list plus force-exclude.
extend-exclude = [
    "leasedesk",
    "datagen",
    "eval",
    "./tests",
    "web",
    "frontend",
    "backend/app/agents",
    "backend/app/docs",
    "backend/app/engine",
    "backend/app/llm",
    # backend/tests/*.py cannot be listed here: globs cross "/" and would
    # also drop backend/tests/platform. The pre-commit `files:` regex
    # scopes explicit test paths instead.
]
force-exclude = true

[lint]
# pycodestyle, pyflakes, import order, bugbear. No pyupgrade: the code uses
# %-formatting and typing generics on purpose.
select = ["E", "W", "F", "I", "B"]
# `l` is the idiomatic name for a journal line in this codebase.
ignore = ["E741"]

[lint.isort]
known-first-party = ["app", "leasedesk", "datagen", "eval"]

[lint.per-file-ignores]
# Alembic revisions are generated; keep their header layout.
"backend/app/db/migrations/versions/*.py" = ["E501"]
# Fixtures imported from a sibling test module look like redefinitions.
"backend/tests/platform/*.py" = ["F811"]

[format]
# Not enforced yet: the platform code is hand-aligned and 17 files would be
# rewritten. Run `pre-commit run --hook-stage manual ruff-format` to see it.
quote-style = "double"

[lint.flake8-bugbear]
# FastAPI's dependency markers are meant to sit in argument defaults.
extend-immutable-calls = ["app.auth.deps.require_role", "fastapi.Depends", "fastapi.Query", "fastapi.Path",
                          "fastapi.Body", "fastapi.Cookie", "fastapi.Header"]
